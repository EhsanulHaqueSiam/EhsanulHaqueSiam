# Generates isometric contribution calendar using lowlighter/metrics
#
# SETUP REQUIRED: Create a Personal Access Token (PAT) and add it as a repository secret:
#   1. Go to GitHub Settings > Developer Settings > Personal Access Tokens > Tokens (classic)
#   2. Create token with 'public_repo' scope
#   3. Go to this repo's Settings > Secrets > Actions > New repository secret
#   4. Name: METRICS_TOKEN, Value: your token
#   5. Manually run this workflow from Actions tab

name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  isocalendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Dhaka
          output_action: commit
          committer_branch: metrics
