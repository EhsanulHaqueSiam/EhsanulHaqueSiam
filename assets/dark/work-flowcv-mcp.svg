<svg xmlns="http://www.w3.org/2000/svg" width="590" height="170" viewBox="0 0 590 170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" ><defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.95 0 0 0 0 0.93 0 0 0 0 0.89 0 0 0 0.05 0"/></filter>
</defs>
<style>
@keyframes drift1{0%{transform:translate(0,0)}50%{transform:translate(90px,40px)}100%{transform:translate(0,0)}}
@keyframes drift2{0%{transform:translate(0,0)}50%{transform:translate(-70px,-30px)}100%{transform:translate(0,0)}}
@keyframes drift3{0%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-50px) scale(1.15)}100%{transform:translate(0,0) scale(1)}}
@keyframes pulse{0%,100%{opacity:.35;r:4}50%{opacity:1;r:6}}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.8}100%{transform:translateY(-140px);opacity:0}}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}
.d1{animation:drift1 14s ease-in-out infinite}.d2{animation:drift2 18s ease-in-out infinite}.d3{animation:drift3 22s ease-in-out infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}.rise{animation:rise 9s linear infinite}.marquee{animation:marquee 28s linear infinite}
.spin{animation:spin 30s linear infinite;transform-origin:center;transform-box:fill-box}.blink{animation:blink 1s step-end infinite}.breathe{animation:breathe 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><rect x="0.5" y="0.5" width="589" height="169" rx="18" fill="#24211D" stroke="#36312B"/>
<circle cx="32" cy="38" r="6" fill="#f1e05a"/><text x="48" y="44" fill="#F3EDE3" font-size="20" font-weight="700" letter-spacing="-0.3">FlowCV MCP</text>
<text x="566" y="44" fill="#9A9185" font-size="15" text-anchor="end">pushed 8 mo ago</text>
<text x="24" y="76" fill="#D4CCC0" font-size="17">MCP server and CLI giving AI assistants full control</text><text x="24" y="101" fill="#D4CCC0" font-size="17">of the FlowCV resume builder. 50 tools.</text>
<g opacity="0"><rect x="24" y="124" width="46" height="24" rx="12" fill="#E88C78" fill-opacity="0.16"/><text x="47.0" y="140" fill="#E88C78" font-size="14" font-weight="700" text-anchor="middle">MCP</text><rect x="78.03999999999999" y="124" width="55" height="24" rx="12" fill="#E88C78" fill-opacity="0.16"/><text x="105.4" y="140" fill="#E88C78" font-size="14" font-weight="700" text-anchor="middle">Node</text><rect x="140.76" y="124" width="168" height="24" rx="12" fill="#E88C78" fill-opacity="0.16"/><text x="224.5" y="140" fill="#E88C78" font-size="14" font-weight="700" text-anchor="middle">Chrome automation</text><animate attributeName="opacity" from="0" to="1" begin="0.30s" dur="0.8s" fill="freeze"/></g>
<rect x="0.5" y="0.5" width="589" height="169" rx="18" fill="none" stroke="#E88C78" stroke-opacity="0.22"/></svg>