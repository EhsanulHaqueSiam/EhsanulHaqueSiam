<text x="24" y="140" fill="#4A443D" font-size="17">Leading LLM and Bengali NLP research toward</text><text x="24" y="164" fill="#4A443D" font-size="17">peer-reviewed publication with a distributed team of</text><text x="24" y="188" fill="#4A443D" font-size="17">researchers across AIUB, BUET, BRAC and RUET.</text>
