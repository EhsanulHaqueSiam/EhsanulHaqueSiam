<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <g opacity="0" transform="translate(0 0)">
    <rect x="8" y="8" width="384" height="204" rx="12" fill="#000" stroke="#27272a"/>
    <rect x="8" y="8" width="384" height="204" rx="12" fill="none" stroke="#22d3ee" stroke-opacity="0.35"/>
    <rect x="24" y="30" width="36" height="4" rx="2" fill="#22d3ee"><animate attributeName="width" values="36;72;36" dur="4s" begin="0.0s" repeatCount="indefinite"/></rect>
    <text x="24" y="60" fill="#fff" font-size="19" font-weight="700" letter-spacing="-0.3">LLM systems in production</text>
    <text x="24" y="86" fill="#d4d4d8" font-size="14">RAG on Vertex AI (Document AI + Gemini)</text><text x="24" y="110" fill="#d4d4d8" font-size="14">Gemini 2.5 fine-tuning, LLM eval pipelines</text><text x="24" y="134" fill="#d4d4d8" font-size="14">MCP servers, serverless GCP, Terraform</text>
    <text x="24" y="190" fill="#22d3ee" font-size="12.5" font-weight="600">DocMind · FlowCV MCP · Polashi · Veritas KYC</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.8s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" begin="0.15s" dur="0.8s" fill="freeze"/>
  </g><g opacity="0" transform="translate(400 0)">
    <rect x="8" y="8" width="384" height="204" rx="12" fill="#000" stroke="#27272a"/>
    <rect x="8" y="8" width="384" height="204" rx="12" fill="none" stroke="#a78bfa" stroke-opacity="0.35"/>
    <rect x="24" y="30" width="36" height="4" rx="2" fill="#a78bfa"><animate attributeName="width" values="36;72;36" dur="4s" begin="0.6s" repeatCount="indefinite"/></rect>
    <text x="24" y="60" fill="#fff" font-size="19" font-weight="700" letter-spacing="-0.3">Full-stack product</text>
    <text x="24" y="86" fill="#d4d4d8" font-size="14">React 19, TanStack Start, Convex, Expo</text><text x="24" y="110" fill="#d4d4d8" font-size="14">Flutter, Fastify, FastAPI, PostgreSQL, Go, Rust</text><text x="24" y="134" fill="#d4d4d8" font-size="14">Design to CI/CD to cloud, end to end</text>
    <text x="24" y="190" fill="#a78bfa" font-size="12.5" font-weight="600">InvoicePilot · Eventarc · 4 BetaScript sites</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.8s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="400 16" to="400 0" begin="0.4s" dur="0.8s" fill="freeze"/>
  </g><g opacity="0" transform="translate(800 0)">
    <rect x="8" y="8" width="384" height="204" rx="12" fill="#000" stroke="#27272a"/>
    <rect x="8" y="8" width="384" height="204" rx="12" fill="none" stroke="#f472b6" stroke-opacity="0.35"/>
    <rect x="24" y="30" width="36" height="4" rx="2" fill="#f472b6"><animate attributeName="width" values="36;72;36" dur="4s" begin="1.2s" repeatCount="indefinite"/></rect>
    <text x="24" y="60" fill="#fff" font-size="19" font-weight="700" letter-spacing="-0.3">Research</text>
    <text x="24" y="86" fill="#d4d4d8" font-size="14">NLP and LLMs: topic modeling, medical BERTs</text><text x="24" y="110" fill="#d4d4d8" font-size="14">Bengali NLP toward publication</text><text x="24" y="134" fill="#d4d4d8" font-size="14">IEEE Xplore (Scopus), Taylor &amp; Francis</text>
    <text x="24" y="190" fill="#f472b6" font-size="12.5" font-weight="600">2 papers · 1 conference talk</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.65s" dur="0.8s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="800 16" to="800 0" begin="0.65s" dur="0.8s" fill="freeze"/>
  </g>
</svg>