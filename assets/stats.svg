<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="1200" height="120" rx="12" fill="#000" stroke="#27272a"/>
  <line x1="300" y1="24" x2="300" y2="96" stroke="#27272a"/><line x1="600" y1="24" x2="600" y2="96" stroke="#27272a"/><line x1="900" y1="24" x2="900" y2="96" stroke="#27272a"/>
  <g opacity="0" transform="translate(0 0)">
    <text x="150" y="58" text-anchor="middle" fill="#fff" font-size="40" font-weight="700" letter-spacing="-1">50K+</text>
    <text x="150" y="88" text-anchor="middle" fill="#a1a1aa" font-size="14" letter-spacing="1">USERS SERVED</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.2s" dur="0.7s" fill="freeze" additive="replace"/>
  </g><g opacity="0" transform="translate(300 0)">
    <text x="150" y="58" text-anchor="middle" fill="#fff" font-size="40" font-weight="700" letter-spacing="-1">1.5x</text>
    <text x="150" y="88" text-anchor="middle" fill="#a1a1aa" font-size="14" letter-spacing="1">CLIENT REVENUE GROWTH</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="300 14" to="300 0" begin="0.4s" dur="0.7s" fill="freeze" additive="replace"/>
  </g><g opacity="0" transform="translate(600 0)">
    <text x="150" y="58" text-anchor="middle" fill="#fff" font-size="40" font-weight="700" letter-spacing="-1">3</text>
    <text x="150" y="88" text-anchor="middle" fill="#a1a1aa" font-size="14" letter-spacing="1">PAPERS &AMP; TALKS</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.6000000000000001s" dur="0.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="600 14" to="600 0" begin="0.6000000000000001s" dur="0.7s" fill="freeze" additive="replace"/>
  </g><g opacity="0" transform="translate(900 0)">
    <text x="150" y="58" text-anchor="middle" fill="#fff" font-size="40" font-weight="700" letter-spacing="-1">8+</text>
    <text x="150" y="88" text-anchor="middle" fill="#a1a1aa" font-size="14" letter-spacing="1">PRODUCTION APPS</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="900 14" to="900 0" begin="0.8s" dur="0.7s" fill="freeze" additive="replace"/>
  </g>
</svg>